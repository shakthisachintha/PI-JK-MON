[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ray-vault"
version = "2.0.0"
description = "Ray Vault: JK BMS and SRNE inverter monitor/controller for Raspberry Pi (BLE, Modbus, SQLite, REST, web dashboard)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bleak>=1.0",
  "fastapi>=0.115",
  "minimalmodbus>=2.1",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
ray-vault = "ray_vault.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ray_vault"]
# The dashboard build output is git-ignored, so include it explicitly.
artifacts = ["ray_vault/static/**"]

[tool.hatch.build.targets.sdist]
include = ["ray_vault", "tests", "README.md", "config.example.toml"]
artifacts = ["ray_vault/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
