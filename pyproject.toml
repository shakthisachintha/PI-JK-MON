[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jkbms-pi"
version = "1.0.0"
description = "JK BMS monitor for Raspberry Pi: BLE reader, SQLite history, REST API and web dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bleak>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
jkbms-pi = "jkbms_pi.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["jkbms_pi"]
# The dashboard build output is git-ignored, so include it explicitly.
artifacts = ["jkbms_pi/static/**"]

[tool.hatch.build.targets.sdist]
include = ["jkbms_pi", "tests", "README.md", "config.example.toml"]
artifacts = ["jkbms_pi/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
