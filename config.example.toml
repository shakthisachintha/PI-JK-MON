# JK BMS monitor configuration. Copy to /etc/jkbms-pi/config.toml.
# Every key can be overridden with an environment variable: JKBMS_<KEY>, e.g. JKBMS_BMS_MAC.

# BLE MAC address of the BMS (any letter case). Required unless running with --fake.
bms_mac = "c8:47:80:71:44:d4"

# BlueZ adapter
adapter = "hci0"

# SQLite database file
db_path = "/var/lib/jkbms-pi/jkbms.db"

# HTTP server (0.0.0.0 = reachable from the LAN)
http_host = "0.0.0.0"
http_port = 8080

# Store one reading every N seconds while data is fresh
sample_interval_s = 3

# Readings older than this are not stored, and are flagged stale in the API
stale_s = 10

# Keep raw samples this many days; per-minute rollups are kept forever
raw_retention_days = 30

# Link supervision and recovery, all driven by "time since the last cell-data frame":
#   re-request cell info every cell_rerequest_s
#   disconnect and reconnect after link_timeout_s
#   power-cycle the Bluetooth adapter after adapter_reset_after_s, then again with doubling backoff
#     (capped at adapter_reset_max_interval_s)
#   after restart_after_resets resets that didn't help, exit; systemd restarts bluetoothd and this service
#     (0 = never give up, keep resetting the adapter)
cell_rerequest_s = 5
link_timeout_s = 20
adapter_reset_after_s = 120
adapter_reset_max_interval_s = 1800
restart_after_resets = 3

# How often to read the BMS signal strength (RSSI) while connected
rssi_poll_s = 30

log_level = "INFO"
